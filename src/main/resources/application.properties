server.port=${SERVER_PORT:8082}
spring.application.name=lostfound

# Database Connection Details: configure credentials via environment variables
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/xepdb1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# Mail Settings: provide credentials via environment variables when mail is enabled
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin Credentials: no default password
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD}

# JWT Configuration: set a unique random secret of at least 32 bytes
jwt.secret=${JWT_SECRET}

spring.main.allow-bean-definition-overriding=true

# File Upload Constraints
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
