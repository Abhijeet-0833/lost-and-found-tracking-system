server.port=${SERVER_PORT:8082}
spring.application.name=lostfound

# Database Connection Details
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/xepdb1}
spring.datasource.username=${DB_USERNAME:SYSTEM}
spring.datasource.password=${DB_PASSWORD:LION}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# Mail Settings
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:admin@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_16_digit_app_key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin Credentials
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:admin123}

# JWT Configuration
jwt.secret=${JWT_SECRET:your_very_secret_key_that_should_be_long_and_secure}

spring.main.allow-bean-definition-overriding=true

# File Upload Constraints
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB